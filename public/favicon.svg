  <rect width="64" height="64" rx="16" fill="#12100E"/>
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#A9862F" stroke-opacity="0.3" stroke-width="1"/>
  
  <!-- Architectural Apex / Diamond Pavilion Emblem -->
  <g transform="translate(12, 10)">
